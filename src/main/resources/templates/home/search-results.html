<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Results | StayEase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <main class="results-page">
    <div class="container">

      <div class="results-header">
        <div>
          <h1 id="resultsTitle">Search Results</h1>
          <p id="resultsSubtitle" style="font-size:14px; color:var(--muted); margin-top:4px;"></p>
        </div>
        <div class="sort-bar">
          <label>Sort by:</label>
          <div class="custom-select" id="sortDropdown">
            <div class="custom-select-trigger">
              <span th:text="${sort == 'price_desc'} ? 'Price: High to Low' : (${sort == 'price_asc'} ? 'Price: Low to High' : 'Top Rated')">Top Rated</span>
              <i class="fa-solid fa-chevron-down"></i>
            </div>
            <div class="custom-select-options">
              <div class="custom-option" th:classappend="${sort == 'price_asc'} ? ' selected'" data-value="price_asc">Price: Low to High</div>
              <div class="custom-option" th:classappend="${sort == 'price_desc'} ? ' selected'" data-value="price_desc">Price: High to Low</div>
              <div class="custom-option" th:classappend="${sort == 'rating'} ? ' selected'" data-value="rating">Top Rated</div>
            </div>
            <input type="hidden" name="sort" th:value="${sort}">
          </div>
        </div>
      </div>

      <div class="results-layout">

        <form id="filtersForm" method="GET" th:action="@{/search}">
          <input type="hidden" name="city" th:value="${city}">
          <input type="hidden" name="check_in" th:value="${checkIn}">
          <input type="hidden" name="check_out" th:value="${checkOut}">
          <input type="hidden" name="sort" th:value="${sort}">

          <aside class="filters-panel">
            <div class="filters-top">
              <h3>Filters</h3>
              <a th:href="@{/search(city=${city}, check_in=${checkIn}, check_out=${checkOut})}" class="clear-btn">Clear all</a>
            </div>

            <div class="filter-group">
              <label class="group-label">Price Range (per night)</label>
              <div class="price-range">
                <input type="range" id="priceRange" name="max_price" min="0" max="1000" th:value="${maxPrice}" step="10">
                <div class="price-labels">
                  <span>$0</span>
                  <span id="priceMax" th:text="'$' + ${maxPrice}">$1000</span>
                </div>
              </div>
            </div>

            <div class="filter-group">
              <label class="group-label">Star Rating</label>
              <label class="checkbox-item" th:each="s : ${#numbers.sequence(5, 3, -1)}">
                <input type="checkbox" name="stars" th:value="${s}" th:checked="${selectedStars.contains(s)}">
                <span th:text="${s}">5</span> Stars <span style="color:#F59E0B; margin-left:4px;">★</span>
              </label>
            </div>
          </aside>
        </form>

        <div id="resultsContainer">
          <div th:if="${#lists.isEmpty(hotels)}" class="empty-state">
            <i class="fa-solid fa-magnifying-glass"></i>
            <h3>No hotels found</h3>
            <p>Try a different city or broaden your search.</p>
          </div>

          <div th:each="hotel : ${hotels}" class="result-card">
            <div class="result-card-img">
              <img th:src="${hotel.image}" th:alt="${hotel.name}">
              <button class="wishlist-btn"><i class="fa-regular fa-heart"></i></button>
            </div>
            <div class="result-card-body">
              <div class="result-card-top">
                <div>
                  <h3 th:text="${hotel.name}">Hotel Name</h3>
                  <p class="result-location"><i class="fa-solid fa-location-dot fa-xs"></i> <span th:text="${hotel.location}">Location</span></p>
                  <div class="hotel-stars" style="font-size:14px;">
                    <span th:each="i : ${#numbers.sequence(1, hotel.stars)}">★</span>
                    <span th:each="i : ${#numbers.sequence(hotel.stars + 1, 5)}">☆</span>
                  </div>
                </div>
              </div>
              <p class="result-desc" th:text="${hotel.description}">Description</p>
              <div class="result-card-bottom">
                <div class="result-price">
                  <small>Starting from</small>
                  <strong>
                    <span th:if="${minPrices[hotel.id] != null}" th:text="'$' + ${#numbers.formatDecimal(minPrices[hotel.id], 1, 0)}">$0</span>
                    <span th:unless="${minPrices[hotel.id] != null}">N/A</span>
                  </strong>
                  <span>/ night</span>
                </div>
                <a th:href="@{/hotel/{id}(id=${hotel.id})}" class="btn-view">View Deal</a>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <div th:replace="~{fragments/footer :: footer}"></div>

  <script th:src="@{/js/main.js}"></script>
  <script th:src="@{/js/filters.js}"></script>
</body>
</html>
