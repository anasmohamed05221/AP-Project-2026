<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>All Bookings - Admin - StayEase</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" th:href="@{/css/admin.css}"/>
</head>
<body>

<div class="admin-layout">

    <div th:replace="~{fragments/admin-sidebar :: adminSidebar}"></div>

    <main class="admin-content">

        <div class="page-header">
            <h1 class="page-title">All Bookings</h1>
        </div>

        <div class="table-card">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Guest Name</th>
                            <th>Hotel</th>
                            <th>Room</th>
                            <th>Check-in</th>
                            <th>Check-out</th>
                            <th>Status</th>
                            <th>Booked At</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="booking : ${bookings}">
                            <td th:text="${booking.id}">1</td>
                            <td th:text="${booking.user.name}">Guest Name</td>
                            <td th:text="${booking.room.hotel.name}">Hotel Name</td>
                            <td th:text="${booking.room.name}">Room Name</td>
                            <td th:text="${booking.checkIn}">2025-01-01</td>
                            <td th:text="${booking.checkOut}">2025-01-05</td>
                            <td>
                                <span class="badge"
                                      th:text="${booking.status}"
                                      th:class="${booking.status == 'confirmed'} ? 'badge badge-confirmed' : (${booking.status == 'cancelled'} ? 'badge badge-cancelled' : 'badge badge-pending')">
                                    pending
                                </span>
                            </td>
                            <td th:text="${booking.createdAt}">2025-01-01</td>
                            <td>
                                <div class="actions-cell">
                                    <form th:if="${booking.status != 'cancelled'}"
                                          th:action="@{/admin/bookings/cancel/{id}(id=${booking.id})}"
                                          method="post"
                                          onsubmit="return confirm('Cancel this booking?');">
                                        <button type="submit" class="btn btn-sm btn-danger">
                                            <i class="fa-solid fa-ban"></i>
                                            Cancel
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(bookings)}">
                            <td colspan="9" style="text-align:center; color: var(--muted); padding: 32px;">
                                No bookings found.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>
</div>

</body>
</html>
