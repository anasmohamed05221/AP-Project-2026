<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StayEase Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" th:href="@{/css/main.css}">
  <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="admin-layout">

  <div th:replace="~{fragments/admin-sidebar :: adminSidebar}"></div>

  <main class="admin-content">
    <div class="admin-page-header">
      <h1 th:text="${room.id != null} ? 'Edit Room' : 'Add Room'">Room Form</h1>
    </div>

    <div class="admin-form-card">
      <form th:action="${room.id != null} ? @{/admin/rooms/edit/{id}(id=${room.id})} : @{/admin/hotels/{hotelId}/rooms/add(hotelId=${hotel.id})}"
            method="post">

        <div class="form-group">
          <label>Room Name</label>
          <input type="text" name="name" th:value="${room.name}" placeholder="e.g. Deluxe King Suite">
        </div>

        <div class="form-group">
          <label>Type</label>
          <input type="text" name="type" th:value="${room.type}" placeholder="e.g. Suite, Standard, Deluxe">
        </div>

        <div class="form-group">
          <label>Price Per Night ($)</label>
          <input type="number" name="pricePerNight" th:value="${room.pricePerNight}" step="0.01" min="0">
        </div>

        <div class="form-group">
          <label>Description</label>
          <textarea name="description" th:text="${room.description}" placeholder="Room description..."></textarea>
        </div>

        <div class="form-group">
          <label>Image URL</label>
          <input type="text" name="image" th:value="${room.image}" placeholder="https://...">
        </div>

        <div class="form-group">
          <label>Available</label>
          <select name="isAvailable">
            <option value="true" th:selected="${room.isAvailable == null or room.isAvailable}">Yes</option>
            <option value="false" th:selected="${room.isAvailable != null and !room.isAvailable}">No</option>
          </select>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-primary">Save Room</button>
          <a th:href="@{/admin/hotels}" class="btn-cancel">Cancel</a>
        </div>
      </form>
    </div>
  </main>

</div>
</body>
</html>
